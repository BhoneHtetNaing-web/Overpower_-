services:

  postgres:

    image: postgres:16-alpine

    container_name: trademark-postgres

    restart: unless-stopped

    environment:

      POSTGRES_DB: trademark_conflict

      POSTGRES_USER: trademark

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test:

        [

          "CMD-SHELL",

          "pg_isready -U trademark -d trademark_conflict"

        ]

      interval: 10s

      timeout: 5s

      retries: 10

    networks:

      - trademark_network

  # =========================================================

  # Redis

  # =========================================================

  redis:

    image: redis:7-alpine

    container_name: trademark-redis

    restart: unless-stopped

    command:

      [

        "redis-server",

        "--appendonly",

        "yes"

      ]

    volumes:

      - redis_data:/data

    healthcheck:

      test:

        [

          "CMD",

          "redis-cli",

          "ping"

        ]

      interval: 10s

      timeout: 5s

      retries: 10

    networks:

      - trademark_network

  # =========================================================

  # FastAPI Backend

  # =========================================================

  backend:

    build:

      context: ./backend

      dockerfile: Dockerfile

    container_name: trademark-backend

    restart: unless-stopped

    env_file:

      - ./backend/.env.production

    environment:

      APP_ENV: production

      BACKEND_BASE_URL: http://backend:8000

      DB_HOST: postgres

      DB_PORT: 5432

      DB_NAME: trademark_conflict

      DB_USER: trademark

      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_URL: redis://redis:6379/0

      OIDC_ISSUER: ${OIDC_ISSUER:-}

      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}

      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}

      OIDC_TENANT_CLAIM: ${OIDC_TENANT_CLAIM:-tenant_id}

      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}

      EVIDENCE_URL_SIGNING_KEY: ${EVIDENCE_URL_SIGNING_KEY:-}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-90}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+mya}

    depends_on:

      postgres:

        condition: service_healthy

      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

    volumes:

      - uploads_data:/app/uploads

      - extracted_data:/app/extracted

      - evidence_data:/app/evidence

      - portfolio_data:/app/portfolios

    ports:
      - "8002:8000"

    networks:

      - trademark_network

  analysis-worker:

    build:

      context: ./backend

      dockerfile: Dockerfile

    container_name: trademark-analysis-worker

    restart: unless-stopped

    env_file:

      - ./backend/.env.production

    environment:

      APP_ENV: production

      DB_HOST: postgres

      DB_PORT: 5432

      DB_NAME: trademark_conflict

      DB_USER: trademark

      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_URL: redis://redis:6379/0
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+mya}

    command:

      [

        "rq",

        "worker",

        "-u",

        "redis://redis:6379/0",

        "--with-scheduler",

        "trademark-analysis",

      ]

    depends_on:

      postgres:

        condition: service_healthy

      redis:

        condition: service_healthy

      backend:

        condition: service_healthy

    volumes:

      - uploads_data:/app/uploads

      - extracted_data:/app/extracted

      - evidence_data:/app/evidence

      - portfolio_data:/app/portfolios

    networks:

      - trademark_network

  retention-cleanup:

    build:

      context: ./backend

      dockerfile: Dockerfile

    container_name: trademark-retention-cleanup

    restart: unless-stopped

    env_file:

      - ./backend/.env.production

    environment:

      APP_ENV: production

      DB_HOST: postgres

      DB_PORT: 5432

      DB_NAME: trademark_conflict

      DB_USER: trademark

      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CLEANUP_INTERVAL_SECONDS: 86400

    command: ["python", "-m", "app.cleanup"]

    depends_on:

      postgres:

        condition: service_healthy

      backend:

        condition: service_healthy

    volumes:

      - uploads_data:/app/uploads

      - extracted_data:/app/extracted

      - evidence_data:/app/evidence

    networks:

      - trademark_network

  postgres-backup:

    image: postgres:16-alpine

    container_name: trademark-postgres-backup

    restart: unless-stopped

    environment:

      PGHOST: postgres

      PGDATABASE: trademark_conflict

      PGUSER: trademark

      PGPASSWORD: ${POSTGRES_PASSWORD}

    command:

      - /bin/sh

      - -c

      - |

        while true; do

          pg_dump --no-owner --format=custom --file="/backups/trademark-$$(date -u +%Y%m%dT%H%M%SZ).dump" &&

          find /backups -type f -name 'trademark-*.dump' -mtime +30 -delete

          sleep 86400

        done

    depends_on:

      postgres:

        condition: service_healthy

    volumes:

      - backup_data:/backups

    networks:

      - trademark_network

  # =========================================================

  # MCP Server

  # =========================================================

  mcp:

    build:

      context: ./backend

      dockerfile: Dockerfile

    container_name: trademark-mcp

    restart: unless-stopped

    env_file:

      - ./backend/.env.production

    environment:

      APP_ENV: production

      BACKEND_BASE_URL: http://backend:8000

      MCP_HOST: 0.0.0.0

      MCP_PORT: 8100

      DB_HOST: postgres

      DB_PORT: 5432

      DB_NAME: trademark_conflict

      DB_USER: trademark

      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_URL: redis://redis:6379/0

      OIDC_ISSUER: ${OIDC_ISSUER:-}

      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}

      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}

      OIDC_TENANT_CLAIM: ${OIDC_TENANT_CLAIM:-tenant_id}

      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}

    command:

      [

        "python",

        "-m",

        "apexive_mcp.server"

      ]

    depends_on:

      postgres:

        condition: service_healthy

      redis:

        condition: service_healthy

      backend:

        condition: service_started

    volumes:

      - uploads_data:/app/uploads

      - extracted_data:/app/extracted

      - evidence_data:/app/evidence

    expose:

      - "8100"

    networks:

      - trademark_network

  # =========================================================

  # React / Vite Frontend

  # =========================================================

  frontend:

    build:

      context: ./frontend

      dockerfile: Dockerfile

      args:

        VITE_OIDC_AUTHORITY: ${OIDC_ISSUER:-}

        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}

        VITE_OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}

    container_name: trademark-frontend

    restart: unless-stopped

    depends_on:

      - backend

    expose:

      - "80"

    networks:

      - trademark_network

  # =========================================================

  # NGINX Reverse Proxy

  # =========================================================

  nginx:

    image: nginx:alpine

    container_name: trademark-nginx

    restart: unless-stopped

    ports:

      - "80:80"

      - "443:443"

    volumes:

      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:

      - frontend

      - backend

      - mcp

    networks:

      - trademark_network

# ===========================================================

# Persistent Volumes

# ===========================================================

volumes:

  postgres_data:

  redis_data:

  uploads_data:

  extracted_data:

  evidence_data:

  portfolio_data:

  backup_data:

# ===========================================================

# Internal Docker Network

# ===========================================================

networks:

  trademark_network:

    driver: bridge